# Construit l'ISO agent-os sur GitHub et la met à disposition.
#
# Pourquoi ici plutôt qu'en local : la construction demande debootstrap,
# xorriso et douze gigaoctets libres — c'est-à-dire une machine Debian ou
# Ubuntu. Depuis Windows ou macOS, il faudrait passer par une machine
# virtuelle. Ce workflow évite tout cela : un clic, vingt minutes, un
# fichier à télécharger.
#
# Déclenchement manuel depuis l'onglet Actions, ou automatique sur une
# étiquette « v… », qui publie en plus une release.

name: Image d'installation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # nécessaire pour publier la release

jobs:
  construire:
    name: Construire l'ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        # Le runner arrive avec une trentaine de gigaoctets d'outillages
        # inutiles ici — .NET, Android, GHC. La construction en réclame
        # douze ; sans ce ménage, elle échoue à mi-parcours sur un disque
        # plein, après un quart d'heure de téléchargements.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Installer l'outillage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap xorriso squashfs-tools \
            grub-efi-amd64-bin grub-pc-bin grub2-common mtools dosfstools

      - name: Tester le runtime
        # Une image qui embarque un runtime cassé ne vaut rien. Les tests
        # ne dépendent que de la bibliothèque standard : rien à installer.
        run: |
          cd runtime
          python3 -m unittest discover -s tests -t . -v 2>&1 | tail -20

      - name: Construire l'image
        run: sudo bash build/build-iso.sh
        env:
          SUITE: trixie

      - name: Résumer
        id: image
        run: |
          chemin="$(ls build/out/*.iso)"
          nom="$(basename "$chemin")"
          sudo chmod a+r build/out/*
          echo "chemin=$chemin" >> "$GITHUB_OUTPUT"
          echo "nom=$nom"       >> "$GITHUB_OUTPUT"
          {
            echo "## Image construite"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`$nom\` |"
            echo "| Taille | $(du -h "$chemin" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$chemin" | cut -d' ' -f1)\` |"
            echo
            echo "Écriture sur clé USB : voir \`docs/cle-usb.md\`."
            echo "**Le Secure Boot doit être désactivé** pour amorcer dessus."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer l'image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.nom }}
          path: build/out/*
          # Une ISO pèse trois cents mégaoctets : la garder trois mois
          # consommerait le quota de stockage du dépôt pour rien.
          retention-days: 14
          compression-level: 0    # déjà compressée en squashfs

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une release peut déjà exister : créer une version depuis
          # l'interface de GitHub crée l'étiquette, ce qui déclenche ce
          # workflow — lequel trouverait alors la release en place. On
          # téléverse dans ce cas au lieu d'échouer.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/out/* --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" build/out/* \
            --title "agent-os ${GITHUB_REF_NAME}" \
            --notes "Image d'installation amorçable, BIOS et UEFI.

          Écrire sur une clé avec Rufus en **mode DD** — voir \`docs/cle-usb.md\`.
          **Le Secure Boot doit être désactivé**, l'amorceur n'étant pas signé.

          Démarrer sur la clé puis, pour installer sur un disque :

              sudo agentos-installer --simulation   # afficher le plan
              sudo agentos-installer                # efface le disque choisi"
