# Menu d'amorçage de l'image agent-os.

set default=0
set timeout=10

# Le mode texte suffit et démarre plus vite qu'un mode graphique qui doit
# d'abord interroger la carte.
terminal_output console
insmod all_video
insmod iso9660

menuentry "Installer agent-os" {
    linux  /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "Installer agent-os (mode sûr, sans accélération)" {
    linux  /live/vmlinuz boot=live components nomodeset noapic acpi=off
    initrd /live/initrd.img
}

menuentry "Session live (sans installer)" {
    linux  /live/vmlinuz boot=live components
    initrd /live/initrd.img
}

menuentry "Mémoire : test au démarrage" {
    linux  /live/vmlinuz boot=live components memtest
    initrd /live/initrd.img
}
