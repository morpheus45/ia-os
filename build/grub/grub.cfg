# Menu d'amorçage de l'image agent-os.

set default=0
set timeout=10

insmod all_video
insmod iso9660
insmod search
insmod search_label
insmod gfxterm
insmod part_gpt
insmod part_msdos

# L'image GRUB est autonome : sa configuration voyage dans un memdisk
# embarqué, et c'est ce memdisk que « root » désigne au démarrage. Sans la
# recherche ci-dessous, /live/vmlinuz est cherché dans le memdisk — où il
# n'est pas — et aucune entrée ne démarre : le menu s'affiche puis refuse
# obstinément de faire quoi que ce soit. Symptôme constaté en machine
# virtuelle avant correction.
search --no-floppy --set=root --label AGENT-OS

# Police Unicode, chargée depuis l'image et non depuis le binaire GRUB :
# l'image d'amorçage BIOS est plafonnée à 480 Ko, la police en fait 2,4 Mo.
# La condition évite le pire : si gfxterm échoue à s'initialiser sur une
# carte récalcitrante, on reste en mode texte plutôt que de perdre tout
# affichage.
if loadfont ($root)/boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "Installer agent-os" {
    linux  ($root)/live/vmlinuz boot=live components quiet splash
    initrd ($root)/live/initrd.img
}

menuentry "Installer agent-os (mode sûr, sans accélération)" {
    linux  ($root)/live/vmlinuz boot=live components nomodeset noapic acpi=off
    initrd ($root)/live/initrd.img
}

menuentry "Session live (sans installer)" {
    linux  ($root)/live/vmlinuz boot=live components
    initrd ($root)/live/initrd.img
}

menuentry "Console de secours (sortie série)" {
    # Pour diagnostiquer un démarrage muet : les messages du noyau partent
    # sur le port série, capturable par QEMU ou par un câble.
    linux  ($root)/live/vmlinuz boot=live components console=tty0 console=ttyS0,115200n8
    initrd ($root)/live/initrd.img
}
