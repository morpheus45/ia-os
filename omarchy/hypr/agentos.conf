# Raccourcis agent-os.
#
# Sourcé depuis ~/.config/hypr/bindings.conf. Les combinaisons évitent
# SUPER seul, où Omarchy place déjà l'essentiel de ses raccourcis ;
# SUPER+ALT est peu utilisé par défaut.
#
# Pour vérifier les collisions sur ta configuration :
#   hyprctl binds | grep -i -A2 'modmask: 72'
# ou, plus simplement, le menu des raccourcis de Walker.

# Confier une tâche : ouvre une invite dans un terminal.
bind = SUPER ALT, A, exec, $HOME/.local/bin/agentos-desktop ask

# Menu des actions : état, travaux, console, synchro.
bind = SUPER ALT, M, exec, $HOME/.local/bin/agentos-desktop menu

# Console web dans le navigateur.
bind = SUPER ALT, C, exec, $HOME/.local/bin/agentos-desktop console
