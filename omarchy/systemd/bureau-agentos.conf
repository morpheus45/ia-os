# Cohabitation du runtime avec le bureau Omarchy.
#
# Déposé dans /etc/systemd/system/agentos.service.d/. Un fichier de
# complément plutôt qu'une modification de l'unité : une mise à jour
# d'agent-os remplace l'unité, elle ne touche pas à ce fichier.
#
# Le calcul sur 16 Gio : Hyprland, waybar et un navigateur occupent 3 à
# 5 Gio. Il reste onze Gio à partager entre le runtime et le modèle local.
# Le runtime n'a pas besoin de beaucoup — c'est un orchestrateur, pas un
# calculateur — donc il descend de 3 à 2 Gio et laisse la place au modèle.

[Service]
MemoryMax=2G
MemoryHigh=1536M

# L'humain passe avant. Un poids CPU au cinquième du défaut et une
# politesse d'ordonnancement suffisent à ce que le travail de fond ne se
# sente pas : il ralentit quand tu travailles, il accélère quand tu pars.
CPUWeight=20
IOWeight=20
Nice=10

# Sous pression mémoire, le noyau doit sacrifier l'agent avant le bureau.
# Une valeur positive le désigne comme victime plus probable ; le bureau,
# lui, reste à zéro.
OOMScoreAdjust=200
