# Cohabitation du serveur de modèle avec le bureau Omarchy.
#
# Déposé dans /etc/systemd/system/agentos-model.service.d/.
#
# Onze Gio étaient réservés au modèle sur une machine sans écran. Avec un
# bureau, ce n'est plus tenable : sept Gio, ce qui reste confortable pour
# un modèle de sept milliards de paramètres quantifié en quatre bits, et
# ferme la porte à un quatorze milliards. C'est l'arbitrage à assumer
# quand la machine sert aussi de poste de travail.

[Service]
MemoryMax=7G
MemoryHigh=6G

CPUWeight=30
IOWeight=20
Nice=15

# Le modèle est la première chose à tuer sous pression : il se recharge
# depuis le disque en quelques secondes, alors qu'un bureau tué emporte
# le travail en cours de l'utilisateur.
OOMScoreAdjust=800

