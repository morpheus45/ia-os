# Réglages noyau pour une machine de travail de fond, 16 Go de RAM.

# Sans swap, un modèle local qui déborde fait tuer un processus par l'OOM.
# Avec un swappiness bas, le noyau préfère évincer le cache de pages plutôt
# que les pages du modèle, qui seraient rechargées immédiatement.
vm.swappiness = 10

# La mémoire de l'agent est écrite en continu : étaler la remontée sur
# disque évite les à-coups d'un ramassage massif toutes les trente secondes.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# llama.cpp projette le modèle en mémoire ; le compte par défaut de
# projections est trop bas pour un modèle découpé en nombreux blocs.
vm.max_map_count = 262144

# Durcissement réseau : la machine n'a aucune raison de router du trafic
# ni d'accepter des redirections.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv6.conf.all.accept_redirects = 0

# La console et le serveur de modèle n'écoutent que la boucle locale ;
# ce réglage empêche un service mal configuré de les exposer par erreur.
net.ipv4.conf.all.route_localnet = 0

# Journaux noyau réservés à root : ils fuient des adresses utiles à une
# escalade.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
