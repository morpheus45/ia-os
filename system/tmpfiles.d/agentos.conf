# Répertoires du runtime, créés au boot avant le démarrage du service.
# Les droits sont serrés : la mémoire contient tout ce que la machine a vu.
d /var/lib/agentos           0750 agentos agentos -
d /var/lib/agentos/workspace 0750 agentos agentos -
d /var/lib/agentos/sauvegardes 0700 agentos agentos -
d /var/lib/models            0755 agentos agentos -
d /var/log/agentos           0750 agentos agentos -
d /run/agentos               0750 agentos agentos -
d /etc/agentos               0750 root    agentos -
# Le fichier de secrets n'est lisible que par le service.
z /etc/agentos/secrets.env   0640 root    agentos -
